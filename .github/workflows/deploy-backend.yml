name: TicketIQ Cloud Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Setup Python
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: server/requirements.txt


      # ============================================================
      # 3. Restore Ollama model cache
      # ============================================================

      - name: Restore Ollama cache
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama-llama3.1-v1
          restore-keys: |
            ${{ runner.os }}-ollama-


      # ============================================================
      # 4. Restore Sentence Transformer / Hugging Face cache
      # ============================================================

      - name: Restore Hugging Face model cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ${{ runner.os }}-huggingface-all-minilm-v1
          restore-keys: |
            ${{ runner.os }}-huggingface-


      # ============================================================
      # 5. Install Python dependencies
      # ============================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt


      # ============================================================
      # 6. Install Ollama
      # ============================================================

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh


      # ============================================================
      # 7. Start Ollama
      # ============================================================

      - name: Start Ollama
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5

          echo "Checking Ollama..."
          ollama list


      # ============================================================
      # 8. Restore / download llama3.1
      # ============================================================

      - name: Ensure llama3.1 model exists
        run: |
          if ollama list | grep -q "llama3.1"; then
            echo "llama3.1 already exists in cache."
          else
            echo "llama3.1 not found. Downloading..."
            ollama pull llama3.1:latest
          fi

          echo "Available Ollama models:"
          ollama list


      # ============================================================
      # 9. Start FastAPI
      # ============================================================

      - name: Start FastAPI
        env:
          QDRANT_PATH: ${{ github.workspace }}/server/qdrant_db
          OLLAMA_HOST: http://127.0.0.1:11434
          CORS_ORIGINS: https://client-lemon-xi-13.vercel.app
        run: |
          cd server

          nohup python -m uvicorn main:app \
            --host 0.0.0.0 \
            --port 8000 \
            > /tmp/ticketiq.log 2>&1 &

          echo $! > /tmp/ticketiq.pid

          echo "Waiting for FastAPI..."

          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then
              echo "FastAPI is running."
              break
            fi

            sleep 2
          done

          echo "FastAPI logs:"
          cat /tmp/ticketiq.log


      # ============================================================
      # 10. Install cloudflared
      # ============================================================

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared.deb


      # ============================================================
      # 11. Start existing Cloudflare Tunnel
      # ============================================================

      - name: Start Cloudflare Tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          nohup cloudflared tunnel run --token "$CLOUDFLARE_TUNNEL_TOKEN" \
            > /tmp/cloudflared.log 2>&1 &

          sleep 10

          echo "Cloudflare Tunnel logs:"
          cat /tmp/cloudflared.log


      # ============================================================
      # 12. Verify public API
      # ============================================================

      - name: Verify public API
        run: |
          echo "Checking public TicketIQ API..."

          curl --fail --retry 10 --retry-delay 3 \
            https://api.ticketiq.com/

          echo ""
          echo "======================================"
          echo "TicketIQ backend is LIVE"
          echo "======================================"


      # ============================================================
      # 13. Keep runner alive
      # ============================================================

      - name: Keep backend alive
        run: |
          echo "TicketIQ backend is running."
          echo "Runner will remain alive until the GitHub Actions job ends."

          while true; do
            echo "TicketIQ backend still running..."
            sleep 300
          done
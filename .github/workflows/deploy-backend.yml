name: TicketIQ Cloud Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama/models

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Restore Ollama cache
        uses: actions/cache@v4
        with:
          path: .ollama
          key: ${{ runner.os }}-ollama-llama3.2-v1
          restore-keys: |
            ${{ runner.os }}-ollama-

      - name: Restore Sentence Transformer cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ${{ runner.os }}-huggingface-all-minilm-v1
          restore-keys: |
            ${{ runner.os }}-huggingface-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Check runner resources
        run: |
          df -h
          free -h
          mkdir -p "$OLLAMA_MODELS"

      - name: Install Ollama
        run: |
          if command -v ollama >/dev/null 2>&1; then
            echo "Ollama already installed."
          else
            curl -fsSL https://ollama.com/install.sh | sh
          fi
          ollama --version

      - name: Start Ollama
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          OLLAMA_PID=$!

          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:11434/api/tags > /dev/null; then
              echo "Ollama is ready."
              break
            fi

            if ! kill -0 "$OLLAMA_PID" 2>/dev/null; then
              cat /tmp/ollama.log
              exit 1
            fi

            sleep 2
          done

          if ! curl --silent --fail http://127.0.0.1:11434/api/tags > /dev/null; then
            cat /tmp/ollama.log
            exit 1
          fi

          ollama list

      - name: Ensure llama3.2 model exists
        timeout-minutes: 15
        run: |
          echo "Checking llama3.2:latest..."

          if ollama list | awk 'NR>1 {print $1}' | grep -Fxq "llama3.2:latest"; then
            echo "llama3.2:latest found in cache."
          else
            echo "llama3.2:latest not found."
            echo "Downloading llama3.2:latest..."
            ollama pull llama3.2:latest
          fi

          echo "Available Ollama models:"
          ollama list

      - name: Start FastAPI
        env:
          QDRANT_PATH: ${{ github.workspace }}/server/qdrant_db
          OLLAMA_HOST: http://127.0.0.1:11434
          CORS_ORIGINS: https://client-lemon-xi-13.vercel.app
        run: |
          cd server

          nohup python -m uvicorn main:app \
            --host 0.0.0.0 \
            --port 8000 \
            > /tmp/ticketiq.log 2>&1 &

          TICKETIQ_PID=$!
          echo "$TICKETIQ_PID" > /tmp/ticketiq.pid

          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then
              echo "FastAPI is running."
              break
            fi

            if ! kill -0 "$TICKETIQ_PID" 2>/dev/null; then
              cat /tmp/ticketiq.log
              exit 1
            fi

            sleep 2
          done

          if ! curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then
            cat /tmp/ticketiq.log
            exit 1
          fi

          cat /tmp/ticketiq.log

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared.deb

          cloudflared --version

      - name: Start Cloudflare Tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "CLOUDFLARE_TUNNEL_TOKEN secret is missing."
            exit 1
          fi

          nohup cloudflared tunnel run \
            --protocol http2 \
            --token "$CLOUDFLARE_TUNNEL_TOKEN" \
            > /tmp/cloudflared.log 2>&1 &

          CLOUDFLARE_PID=$!

          sleep 10

          if ! kill -0 "$CLOUDFLARE_PID" 2>/dev/null; then
            cat /tmp/cloudflared.log
            exit 1
          fi

          cat /tmp/cloudflared.log

      - name: Verify public API
        run: |
          echo "Checking public TicketIQ API..."

          curl -i \
            --retry 10 \
            --retry-delay 3 \
            --retry-connrefused \
            https://api.ticketiq.com/

          echo ""
          echo "======================================"
          echo "Public API check completed"
          echo "======================================"

          echo "TicketIQ backend is LIVE."

      - name: Keep backend alive
        run: |
          echo "TicketIQ backend is running."

          while true; do
            echo "$(date '+%Y-%m-%d %H:%M:%S') - TicketIQ backend still running..."
            sleep 300
          done
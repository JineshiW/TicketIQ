```yaml
name: TicketIQ Cloud Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      # Store Ollama models inside the repository workspace
      # so GitHub Actions can cache the model between runs.
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama/models

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Setup Python
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: server/requirements.txt


      # ============================================================
      # 3. Restore Ollama model cache
      # ============================================================

      - name: Restore Ollama cache
        uses: actions/cache@v4
        with:
          path: |
            .ollama
          key: ${{ runner.os }}-ollama-llama3.2-v1
          restore-keys: |
            ${{ runner.os }}-ollama-


      # ============================================================
      # 4. Restore Sentence Transformer / Hugging Face cache
      # ============================================================

      - name: Restore Hugging Face model cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ${{ runner.os }}-huggingface-all-minilm-v1
          restore-keys: |
            ${{ runner.os }}-huggingface-


      # ============================================================
      # 5. Install Python dependencies
      # ============================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt


      # ============================================================
      # 6. Check runner resources
      # ============================================================

      - name: Check runner resources
        run: |
          echo "======================================"
          echo "Disk space"
          echo "======================================"
          df -h

          echo ""
          echo "======================================"
          echo "Memory"
          echo "======================================"
          free -h

          echo ""
          echo "======================================"
          echo "Ollama model directory"
          echo "======================================"
          echo "$OLLAMA_MODELS"

          mkdir -p "$OLLAMA_MODELS"


      # ============================================================
      # 7. Install Ollama
      # ============================================================

      - name: Install Ollama
        run: |
          if command -v ollama >/dev/null 2>&1; then
            echo "Ollama already installed."
          else
            echo "Installing Ollama..."
            curl -fsSL https://ollama.com/install.sh | sh
          fi

          echo ""
          echo "Ollama version:"
          ollama --version


      # ============================================================
      # 8. Start Ollama
      # ============================================================

      - name: Start Ollama
        run: |
          echo "Starting Ollama..."

          nohup ollama serve > /tmp/ollama.log 2>&1 &
          OLLAMA_PID=$!

          echo "Ollama PID: $OLLAMA_PID"

          echo ""
          echo "Waiting for Ollama API..."

          for i in {1..30}; do
            if curl --silent --fail \
              http://127.0.0.1:11434/api/tags > /dev/null; then

              echo "Ollama is ready."
              break
            fi

            if ! kill -0 "$OLLAMA_PID" 2>/dev/null; then
              echo "Ollama process died."
              echo ""
              echo "Ollama logs:"
              cat /tmp/ollama.log
              exit 1
            fi

            sleep 2
          done

          if ! curl --silent --fail \
            http://127.0.0.1:11434/api/tags > /dev/null; then

            echo "Ollama failed to start."
            echo ""
            echo "Ollama logs:"
            cat /tmp/ollama.log
            exit 1
          fi

          echo ""
          echo "Available Ollama models:"
          ollama list


      # ============================================================
      # 9. Ensure llama3.2:latest exists
      # ============================================================

      - name: Ensure llama3.2 model exists
        timeout-minutes: 20
        run: |
          echo "======================================"
          echo "Checking llama3.2:latest"
          echo "======================================"

          mkdir -p "$OLLAMA_MODELS"

          echo ""
          echo "Model directory:"
          echo "$OLLAMA_MODELS"

          echo ""
          echo "Current models:"
          ollama list

          if ollama list | awk 'NR>1 {print $1}' | grep -Fxq "llama3.2:latest"; then

            echo ""
            echo "======================================"
            echo "llama3.2:latest FOUND IN CACHE"
            echo "No model download required."
            echo "======================================"

          else

            echo ""
            echo "======================================"
            echo "llama3.2:latest NOT FOUND"
            echo "Downloading model..."
            echo "======================================"

            ollama pull llama3.2:latest

            echo ""
            echo "======================================"
            echo "Model download completed."
            echo "======================================"

            echo ""
            echo "Available Ollama models:"
            ollama list

          fi


      # ============================================================
      # 10. Start FastAPI
      # ============================================================

      - name: Start FastAPI
        env:
          QDRANT_PATH: ${{ github.workspace }}/server/qdrant_db
          OLLAMA_HOST: http://127.0.0.1:11434
          CORS_ORIGINS: https://client-lemon-xi-13.vercel.app
        run: |
          cd server

          echo "Starting FastAPI..."

          nohup python -m uvicorn main:app \
            --host 0.0.0.0 \
            --port 8000 \
            > /tmp/ticketiq.log 2>&1 &

          TICKETIQ_PID=$!

          echo $TICKETIQ_PID > /tmp/ticketiq.pid

          echo "FastAPI PID: $TICKETIQ_PID"

          echo ""
          echo "Waiting for FastAPI..."

          for i in {1..30}; do

            if curl --silent --fail \
              http://127.0.0.1:8000/ > /dev/null; then

              echo "FastAPI is running."
              break
            fi

            if ! kill -0 "$TICKETIQ_PID" 2>/dev/null; then
              echo "FastAPI process died."
              echo ""
              echo "FastAPI logs:"
              cat /tmp/ticketiq.log
              exit 1
            fi

            sleep 2

          done

          if ! curl --silent --fail \
            http://127.0.0.1:8000/ > /dev/null; then

            echo "FastAPI failed to start."
            echo ""
            echo "FastAPI logs:"
            cat /tmp/ticketiq.log
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "FastAPI logs"
          echo "======================================"

          cat /tmp/ticketiq.log


      # ============================================================
      # 11. Install cloudflared
      # ============================================================

      - name: Install cloudflared
        run: |
          echo "Installing cloudflared..."

          curl -L --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared.deb

          echo ""
          echo "cloudflared version:"
          cloudflared --version


      # ============================================================
      # 12. Start existing Cloudflare Tunnel
      # ============================================================

      - name: Start Cloudflare Tunnel
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "CLOUDFLARE_TUNNEL_TOKEN secret is missing."
            exit 1
          fi

          echo "Starting Cloudflare Tunnel..."

          nohup cloudflared tunnel run \
            --token "$CLOUDFLARE_TUNNEL_TOKEN" \
            > /tmp/cloudflared.log 2>&1 &

          CLOUDFLARE_PID=$!

          echo "Cloudflare PID: $CLOUDFLARE_PID"

          sleep 10

          if ! kill -0 "$CLOUDFLARE_PID" 2>/dev/null; then
            echo "Cloudflare Tunnel process died."
            echo ""
            echo "Cloudflare logs:"
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "Cloudflare Tunnel logs"
          echo "======================================"

          cat /tmp/cloudflared.log


      # ============================================================
      # 13. Verify public API
      # ============================================================

      - name: Verify public API
        run: |
          echo "Checking public TicketIQ API..."

          curl \
            --fail \
            --retry 20 \
            --retry-delay 3 \
            --retry-connrefused \
            https://api.ticketiq.com/

          echo ""
          echo "======================================"
          echo "TicketIQ backend is LIVE"
          echo "======================================"


      # ============================================================
      # 14. Keep runner alive
      # ============================================================

      - name: Keep backend alive
        run: |
          echo "======================================"
          echo "TicketIQ backend is running."
          echo "======================================"

          echo ""
          echo "FastAPI:"
          echo "http://127.0.0.1:8000"

          echo ""
          echo "Public API:"
          echo "https://api.ticketiq.com"

          echo ""
          echo "Cloudflare Tunnel:"
          echo "ACTIVE"

          echo ""
          echo "Runner will remain alive until the GitHub Actions job ends."

          while true; do
            echo "$(date '+%Y-%m-%d %H:%M:%S') - TicketIQ backend still running..."
            sleep 300
          done

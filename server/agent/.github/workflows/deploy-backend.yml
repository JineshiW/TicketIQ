name: TicketIQ Cloud Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      OLLAMA_MODELS: ${{ github.workspace }}/.ollama/models

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Restore Ollama cache
        uses: actions/cache@v4
        with:
          path: .ollama
          key: ${{ runner.os }}-ollama-llama3.2-v1
          restore-keys: |
            ${{ runner.os }}-ollama-

      - name: Restore Sentence Transformer cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ${{ runner.os }}-huggingface-all-minilm-v1
          restore-keys: |
            ${{ runner.os }}-huggingface-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Check runner resources
        run: |
          df -h
          free -h
          mkdir -p "$OLLAMA_MODELS"

      - name: Install Ollama
        run: |
          if command -v ollama >/dev/null 2>&1; then
            echo "Ollama already installed."
          else
            curl -fsSL https://ollama.com/install.sh | sh
          fi

          ollama --version

      - name: Start Ollama
        run: |
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          OLLAMA_PID=$!

          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:11434/api/tags > /dev/null; then
              echo "Ollama is ready."
              break
            fi

            if ! kill -0 "$OLLAMA_PID" 2>/dev/null; then
              cat /tmp/ollama.log
              exit 1
            fi

            sleep 2
          done

          if ! curl --silent --fail http://127.0.0.1:11434/api/tags > /dev/null; then
            cat /tmp/ollama.log
            exit 1
          fi

          echo "Available Ollama models:"
          ollama list

      - name: Ensure llama3.2 model exists
        timeout-minutes: 15
        run: |
          if ollama list | awk 'NR>1 {print $1}' | grep -Fxq "llama3.2:latest"; then
            echo "llama3.2:latest found."
          else
            echo "Downloading llama3.2:latest..."
            ollama pull llama3.2:latest
          fi

          echo "Ollama models:"
          ollama list

      - name: Start FastAPI
        env:
          QDRANT_PATH: ${{ github.workspace }}/server/qdrant_db
          OLLAMA_HOST: http://127.0.0.1:11434
          CORS_ORIGINS: https://client-lemon-xi-13.vercel.app
        run: |
          cd server

          nohup python -m uvicorn main:app \
            --host 0.0.0.0 \
            --port 8000 \
            > /tmp/ticketiq.log 2>&1 &

          TICKETIQ_PID=$!
          echo "$TICKETIQ_PID" > /tmp/ticketiq.pid

          echo "Waiting for FastAPI..."

          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then
              echo "FastAPI is running."
              break
            fi

            if ! kill -0 "$TICKETIQ_PID" 2>/dev/null; then
              echo "FastAPI failed to start."
              cat /tmp/ticketiq.log
              exit 1
            fi

            sleep 2
          done

          if ! curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then
            echo "FastAPI health check failed."
            cat /tmp/ticketiq.log
            exit 1
          fi

          echo "FastAPI is LIVE on port 8000."
          cat /tmp/ticketiq.log

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared.deb

          cloudflared --version

      - name: Start Cloudflare Quick Tunnel
        run: |
          echo "Starting Cloudflare Quick Tunnel..."
          echo "The public backend URL will appear below."
          echo ""

          nohup cloudflared tunnel \
            --url http://127.0.0.1:8000 \
            > /tmp/cloudflared.log 2>&1 &

          CLOUDFLARED_PID=$!
          echo "$CLOUDFLARED_PID" > /tmp/cloudflared.pid

          echo "Waiting for Quick Tunnel URL..."

          TUNNEL_URL=""

          for i in {1..30}; do
            TUNNEL_URL=$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)

            if [ -n "$TUNNEL_URL" ]; then
              break
            fi

            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              echo "Cloudflare Quick Tunnel failed."
              cat /tmp/cloudflared.log
              exit 1
            fi

            sleep 2
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "Could not obtain Cloudflare Quick Tunnel URL."
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "TICKETIQ BACKEND PUBLIC URL"
          echo "=============================================="
          echo "$TUNNEL_URL"
          echo "=============================================="
          echo ""
          echo "Copy this URL into your Vercel environment variable."
          echo ""
          echo "Cloudflare Tunnel is running."
          echo "FastAPI remains available through the tunnel."

      - name: Verify Quick Tunnel
        run: |
          echo "Checking Cloudflare Quick Tunnel..."

          sleep 5

          TUNNEL_URL=$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)

          if [ -z "$TUNNEL_URL" ]; then
            echo "Tunnel URL not found."
            cat /tmp/cloudflared.log
            exit 1
          fi

          echo "Testing:"
          echo "$TUNNEL_URL"

          curl -i \
            --retry 10 \
            --retry-delay 3 \
            --retry-connrefused \
            "$TUNNEL_URL/"

          echo ""
          echo "=============================================="
          echo "TicketIQ backend is publicly reachable."
          echo "=============================================="

      - name: Show service status
        run: |
          echo "=============================================="
          echo "TICKETIQ SERVICE STATUS"
          echo "=============================================="

          echo ""
          echo "Ollama:"
          curl --silent http://127.0.0.1:11434/api/tags | head -c 1000
          echo ""

          echo ""
          echo "FastAPI:"
          curl --silent http://127.0.0.1:8000/
          echo ""

          echo ""
          echo "Cloudflare:"
          cat /tmp/cloudflared.log

          echo ""
          echo "=============================================="
          echo "All services are running."
          echo "=============================================="

      - name: Keep backend alive
        run: |
          echo ""
          echo "TicketIQ backend is running."
          echo "Do NOT stop this GitHub Actions job while using the Vercel frontend."
          echo ""

          while true; do
            echo "$(date '+%Y-%m-%d %H:%M:%S') - TicketIQ backend still running..."
            sleep 300
          done